services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: guoxiangke/xbot25
    restart: unless-stopped
    ports:
      - "8802:8000"
    volumes:
      - ./:/app
    environment:
      CONTAINER_ROLE: app
    entrypoint: php artisan octane:start
#   entrypoint: php artisan octane:start --host=0.0.0.0 --port=8000 --watch

  scheduler:
    depends_on:
      - app
    image: guoxiangke/xbot25
    restart: unless-stopped
    volumes:
      - ./:/app
    environment:
      CONTAINER_ROLE: scheduler
    entrypoint: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; echo 'scheduler running'; done"]

  queue:
    depends_on:
      - app
    image: guoxiangke/xbot25
    restart: always
    volumes:
      - ./:/app
    environment:
      CONTAINER_ROLE: queue
    entrypoint: php artisan queue:work --queue=default,contacts --verbose --tries=3 --timeout=90
